<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arafat Real Estate - Premium</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #25D366; --orange: #e67e22; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); }
        
        .form-group { margin: 15px 0; }
        select, input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; color: white; }
        .btn-search { background: var(--secondary); }
        .btn-wa { background: var(--success); }
        .btn-pay { background: var(--orange); }
        
        .property-card { border: 1px solid #eee; padding: 15px; margin-top: 20px; border-radius: 20px; background: #fafafa; }
        .price-box { font-size: 1.2em; font-weight: bold; color: var(--primary); margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏠 Arafat Real Estate</h2>

    <div class="form-group">
        <label>🏗️ Dooro nooca</label>
        <select id="type">
            <option value="Fillo">Fillo</option>
            <option value="Dabaq">Dabaq</option>
        </select>
    </div>

    <div class="form-group">
        <label>📐 Dooro astaamaha (Size)</label>
        <select id="features">
            <option value="1+1">1+1</option>
            <option value="2+1">2+1</option>
            <option value="3+1">3+1</option>
            <option value="Fillo">Fillo</option>
        </select>
    </div>

    <button class="btn btn-search" onclick="calculate()">🔎 Raadi & Xisaabi</button>

    <div id="results"></div>
</div>

<script>
    function calculate() {
        let type = document.getElementById('type').value;
        let feat = document.getElementById('features').value;
        let price = 0;

        // Qiimaha aasaasiga ah
        if (type === "Fillo") {
            price = 300;
        } else {
            if (feat === "1+1") price = 150;
            else if (feat === "2+1") price = 250;
            else if (feat === "3+1") price = 300;
        }

        // Xisaabinta 20%
        let serviceFee = price * 0.20;
        let total = price + serviceFee;

        document.getElementById('results').innerHTML = `
            <div class="property-card">
                <h3>Faahfaahinta Qiimaha:</h3>
                <p><b>Nooca:</b> ${type} (${feat})</p>
                <div class="price-box">
                    Qiimaha: $${price}.00 <br>
                    20% Fee: $${serviceFee.toFixed(2)} <br>
                    Total: $${total.toFixed(2)}
                </div>
                
                <button class="btn btn-wa" onclick="window.open('https://wa.me/252610000000?text=Waxaan rabaa ${type} ${feat} qiimihiisuna yahay $${total.toFixed(2)}')">
                    💬 WhatsApp Mulkiilaha
                </button>
            </div>
        `;
    }
</script>
</body>
</html>
