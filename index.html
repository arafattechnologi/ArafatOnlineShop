<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arafat Online Bookshop</title>

<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #eef2f3;
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 500px;
    width: 100%;
    background: white;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
  }

  h2 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 20px;
  }

  .item {
    border: 1px solid #eee;
    padding: 15px;
    margin-top: 15px;
    border-radius: 15px;
    background: #fcfcfc;
    position: relative;
  }

  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  select, input {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    outline: none;
  }

  select { flex: 2; cursor: pointer; }
  input { flex: 1; text-align: center; font-weight: bold; }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  .add { background: #27ae60; color: white; margin-top: 15px; }
  .add:hover { background: #219150; }

  .remove { 
    background: #ff7675; 
    color: white; 
    padding: 5px; 
    font-size: 13px;
    margin-top: 5px;
  }

  .total-section {
    background: #2c3e50;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 25px;
    border-radius: 18px;
  }

  .total-section span { font-size: 24px; color: #2ecc71; }

  .payment-box {
    margin-top: 20px;
    padding: 20px;
    border: 2px dashed #3498db;
    border-radius: 20px;
    background: #f0faff;
  }

  .ussd-code {
    background: #fff;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.3em;
    color: #d35400;
    border: 1px solid #bee3f8;
    margin: 15px 0;
  }

  .dalbo-btn {
    background: #3498db;
    color: white;
    font-size: 18px;
    box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
  }

  .dalbo-btn:hover { background: #2980b9; }

  .price-tag { color: #27ae60; font-weight: bold; font-size: 14px; }
</style>
</head>

<body>

<div class="container">
  <h2>📚 Arafat Online Shop</h2>

  <div id="list">
    <!-- Item Template -->
    <div class="item">
      <div class="row">
        <select class="book" onchange="calc()">
          <option value="0">Dooro Buug...</option>
          <option value="5">Class 1 Book ($5)</option>
          <option value="6">Class 2 Book ($6)</option>
          <option value="7">Class 3 Book ($7)</option>
          <option value="8">Class 4 Book ($8)</option>
          <option value="4">English Book ($4)</option>
          <option value="6">Science Book ($6)</option>
          <option value="3">History Book ($3)</option>
          <option value="7">Arabic Book ($7)</option>
          <option value="8">ICT Book ($8)</option>
        </select>
        <input type="number" class="qty" value="1" min="1" oninput="calc()">
      </div>
      <div class="price-tag">Subtotal: $<span class="lineTotal">0.00</span></div>
      <button class="remove" onclick="removeItem(this)">Ka saar 🗑️</button>
    </div>
  </div>

  <button class="add" onclick="addItem()">➕ Ku dar Buug kale</button>

  <div class="total-section">
    Galaaska Guud: <b>$<span id="total">0.00</span></b>
  </div>

  <div class="payment-box">
    <h3 style="text-align:center; color:#2980b9; margin-top:0;">💳 Lacag Bixinta</h3>
    <p style="text-align:center; font-size:14px;">Garaac koodkan hoose si aad u bixiso:</p>
    
    <div class="ussd-code" id="ussdDisplay">*789*666517*0#</div>

    <input type="tel" id="phone" placeholder="Geli Nambarkaaga EVC" style="width:94%; margin-bottom:10px;">
    <button class="dalbo-btn" onclick="processOrder()">🛒 Dalbo Hadda</button>
  </div>
</div>

<script>
  // Xisaabi Lacagta
  function calc() {
    let items = document.querySelectorAll(".item");
    let total = 0;

    items.forEach(item => {
      let price = parseFloat(item.querySelector(".book").value) || 0;
      let qty = parseInt(item.querySelector(".qty").value) || 1;
      let lineTotal = price * qty;
      
      item.querySelector(".lineTotal").innerText = lineTotal.toFixed(2);
      total += lineTotal;
    });

    document.getElementById("total").innerText = total.toFixed(2);
    // Cusbooneysii koodha USSD-ga (Round to whole number for USSD)
    document.getElementById("ussdDisplay").innerText = `*789*666517*${Math.round(total)}#`;
  }

  // Ku dar saf cusub
  function addItem() {
    let list = document.getElementById("list");
    let newItem = document.querySelector(".item").cloneNode(true);
    newItem.querySelector(".book").value = "0";
    newItem.querySelector(".qty").value = "1";
    newItem.querySelector(".lineTotal").innerText = "0.00";
    list.appendChild(newItem);
    calc();
  }

  // Ka saar safka
  function removeItem(btn) {
    let items = document.querySelectorAll(".item");
    if(items.length > 1) {
      btn.parentElement.remove();
      calc();
    } else {
      alert("Waa in ugu yaraan hal buug ku jiro dalabkaaga!");
    }
  }

  // Dalbo & Xaqiijin
  function processOrder() {
    let total = document.getElementById("total").innerText;
    let phone = document.getElementById("phone").value;

    if (parseFloat(total) === 0) {
      alert("Fadlan dooro ugu yaraan hal buug!");
      return;
    }

    if (phone.trim() === "") {
      alert("Fadlan geli nambarkaaga!");
      return;
    }

    // Farriinta Xaqiijinta
    let confirmAction = confirm(`Mahubtaa inaa $${total} kaga iibasato Arafat Online Shop?`);
    
    if (confirmAction) {
      alert("Dalabkaaga waa la gudbiyay!\nFadlan hada u garaac: *789*666517*" + Math.round(total) + "#");
    } else {
      alert("Dalabkii waa la baajiyay.");
    }
  }
</script>

</body>
</html>
