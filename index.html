<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arafat Online Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide flex items-center gap-2">
                <i class="fas fa-book-open"></i> Arafat Online Shop
            </h1>
            <span class="bg-emerald-800 text-xs px-3 py-1.5 rounded-full font-semibold border border-emerald-500">Official Store</span>
        </div>
    </nav>

    <div class="container mx-auto p-4 md:p-6 mt-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div id="products-grid" class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="text-xl font-bold flex items-center gap-2 text-gray-800">
                        <i class="fas fa-shopping-basket text-emerald-600"></i> Sifada Dalabkaaga
                    </h2>
                </div>
                
                <div id="cart-items" class="space-y-3 mb-4 max-h-60 overflow-y-auto">
                    <p class="text-gray-400 text-center py-6 text-sm">Kariidkaagu hadda waa maran yahay. Fadlan dooro buug!</p>
                </div>
                
                <div class="border-t pt-4 space-y-2">
                    <div class="flex justify-between font-bold text-lg border-b pb-3">
                        <span class="text-gray-700">Wadar ahaan (Total):</span>
                        <span id="cart-total" class="text-emerald-600 font-extrabold">$0.00</span>
                    </div>
                </div>

                <form id="checkout-form" onsubmit="event.preventDefault();" class="mt-6 space-y-4">
                    <h3 class="font-bold text-gray-700 flex items-center gap-2 text-xs uppercase tracking-wider text-gray-500">
                        <i class="fas fa-user-edit text-emerald-600"></i> Goobta iyo Telefoonka
                    </h3>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nambarkaaga EVC Plus</label>
                        <input type="tel" id="customer-phone" oninput="saveFormData()" placeholder="e.g., 61xxxxxxx" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none bg-gray-50 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Address-kaaga (Halka laguugu keenayo)</label>
                        <input type="text" id="customer-address" oninput="saveFormData()" placeholder="Magaalada, Degmada, Jidka..." required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none bg-gray-50 text-sm">
                    </div>
                    
                    <div class="pt-2 space-y-3">
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wide">Dooro Habka Dalabka:</p>
                        <div class="grid grid-cols-2 gap-3">
                            <button type="button" onclick="processOrder('merchant')" class="bg-amber-500 text-white font-bold py-3 px-2 rounded-xl shadow-xs hover:bg-amber-600 transition text-xs flex flex-col items-center justify-center gap-1 cursor-pointer text-center">
                                <i class="fas fa-wallet text-sm"></i> Koodhka Lacagta (Merchant)
                            </button>
                            <button type="button" onclick="processOrder('whatsapp')" class="bg-emerald-600 text-white font-bold py-3 px-2 rounded-xl shadow-xs hover:bg-emerald-700 transition text-xs flex flex-col items-center justify-center gap-1 cursor-pointer text-center">
                                <i class="fab fa-whatsapp text-sm"></i> Toos u furi WhatsApp
                            </button>
                        </div>
                    </div>

                    <div class="pt-2 border-t border-gray-100">
                        <button type="button" onclick="confirmClearForm()" class="w-full bg-red-50 text-red-600 hover:bg-red-100 font-bold py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-2 cursor-pointer border border-red-200">
                            <i class="fas fa-eraser"></i> Tirtir Xogta & Bilaaw Dalab Cusub
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "252610666653"; 
        const MERCHANT_ID = "666517"; 

        let inventory = [
            { id: 1, title: "Standard Mathematics Grade 8", price: 12.50, category: "School", image: "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500&auto=format&fit=crop&q=60" },
            { id: 2, title: "Islamic History & Culture", price: 15.00, category: "Religious", image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = JSON.parse(localStorage.getItem('arafat_cart')) || [];
        let globalTotal = 0;

        function renderStore() {
            const grid = document.getElementById('products-grid');
            if (!grid) return; grid.innerHTML = '';
            inventory.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-100 flex flex-col justify-between">
                        <img src="${item.image}" class="w-full h-44 object-cover rounded-lg mb-3">
                        <h3 class="font-bold text-gray-800 text-base line-clamp-2">${item.title}</h3>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-lg font-black text-emerald-600">$${item.price.toFixed(2)}</span>
                            <button onclick="addToCart(${item.id})" class="bg-emerald-600 text-white py-1.5 px-4 rounded-lg font-bold hover:bg-emerald-700 transition cursor-pointer text-xs">Dalbo Kitaab</button>
                        </div>
                    </div>`;
            });
        }

        function addToCart(id) {
            const product = inventory.find(item => item.id === id);
            const cartItem = cart.find(item => item.id === id);
            if (cartItem) { cartItem.qty++; } else { cart.push({ ...product, qty: 1 }); }
            saveCart();
            renderCart();
            Swal.fire({ icon: 'success', title: 'Buugga waa lagu daray!', text: 'Wuxuu ku jiraa Sifada Dalabkaaga.', showConfirmButton: false, timer: 1000 });
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-6 text-sm">Kariidkaagu hadda waa maran yahay. Fadlan dooro buug!</p>`;
                document.getElementById('cart-total').innerText = "$0.00";
                globalTotal = 0;
                return;
            }
            container.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="flex justify-between items-center border-b border-gray-50 pb-2 text-sm">
                        <div class="flex-1 pr-2">
                            <h4 class="font-bold text-gray-800 text-xs line-clamp-1">${item.title}</h4>
                            <span class="text-xs text-emerald-600 font-semibold">$${item.price.toFixed(2)} x ${item.qty}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-700 text-xs">$${(item.price * item.qty).toFixed(2)}</span>
                            <button onclick="removeFromCart(${item.id})" class="text-red-400 hover:text-red-600 p-1 cursor-pointer"><i class="fas fa-times-circle"></i></button>
                        </div>
                    </div>`;
            });
            globalTotal = total;
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function removeFromCart(id) { cart = cart.filter(item => item.id !== id); saveCart(); renderCart(); }
        function saveCart() { localStorage.setItem('arafat_cart', JSON.stringify(cart)); }
        
        function saveFormData() {
            localStorage.setItem('customer_phone', document.getElementById('customer-phone').value);
            localStorage.setItem('customer_address', document.getElementById('customer-address').value);
        }
        function loadFormData() {
            if(localStorage.getItem('customer_phone')) document.getElementById('customer-phone').value = localStorage.getItem('customer_phone');
            if(localStorage.getItem('customer_address')) document.getElementById('customer-address').value = localStorage.getItem('customer_address');
        }

        function confirmClearForm() {
            Swal.fire({
                title: 'Ma hubtaa?',
                text: "Tani waxay tirtiri doontaa dhammaan buugaagta iyo macluumaadkaaga!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Haa, tirtir xogta',
                cancelButtonText: 'Ka noqo'
            }).then((result) => {
                if (result.isConfirmed) {
                    cart = []; saveCart(); renderCart();
                    document.getElementById('checkout-form').reset();
                    localStorage.removeItem('customer_phone');
                    localStorage.removeItem('customer_address');
                    Swal.fire({ title: 'Waa la tirtiray!', icon: 'success', timer: 1000, showConfirmButton: false });
                }
            });
        }

        function processOrder(type) {
            const phone = document.getElementById('customer-phone').value;
            const address = document.getElementById('customer-address').value;

            if (!phone || !address) {
                Swal.fire({ title: 'Xogta Ma Buuxda!', text: 'Fadlan qor Telefoonkaaga iyo Address-kaaga.', icon: 'warning', confirmButtonColor: '#059669' });
                return;
            }
            if (cart.length === 0) {
                Swal.fire({ title: 'Gaadhigu waa maran yahay!', text: 'Fadlan marka hore buug dooro.', icon: 'warning', confirmButtonColor: '#059669' });
                return;
            }

            const ussdCode = `*789*${MERCHANT_ID}*${globalTotal.toFixed(2)}#`;

            if (type === 'whatsapp') {
                sendToWhatsApp(phone, address);
            } 
            else if (type === 'merchant') {
                // Tiri nidaamka in-app browser-ka ee baraha bulshada
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const isInAppBrowser = /FBAN|FBAV|Instagram|TikTok|Line|Twitter|FBIOS/i.test(userAgent);
                const isMobile = /Android|iPhone|iPad|iPod/i.test(userAgent);

                if (isMobile && !isInAppBrowser) {
                    // Haddii uu yahay Browser nadiif ah sida Chrome/Safari, toos u furi shaashadda wicitaanka
                    window.location.href = `tel:${ussdCode}`;
                } else {
                    // Haddii lagu jiro Facebook/Instagram dhexdiisa, koobi garee si looga baaqsado ERR_UNKNOWN_URL_SCHEME
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(ussdCode).then(() => { showFallbackPopup(ussdCode, true); });
                    } else {
                        showFallbackPopup(ussdCode, false);
                    }
                }
            }
        }

        function showFallbackPopup(code, isCopied) {
            let msg = isCopied ? 'Koodhka si toos ah ayaa loo koobiyeeyay!' : 'Farta ku hay koodhkan si aad u koobiyaysato:';
            Swal.fire({
                title: msg,
                html: `<br><input type="text" readonly value="${code}" class="w-full text-center p-3 border-2 border-amber-500 rounded-xl font-bold text-lg text-amber-600 bg-amber-50 select-all"><br><br><p class="text-xs text-gray-600 font-semibold">Browser-ka baraha bulshada ma oggola inuu taleefonka si toos ah u furo.</p><p class="text-xs text-gray-400 mt-1">Fadlan koodhkan garaac adoo u guuraya qaybta wicitaanka taleefonkaaga si aad u bixiso.</p>`,
                icon: 'info',
                confirmButtonText: 'OK, Waan Fahmay',
                confirmButtonColor: '#059669'
            });
        }

        function sendToWhatsApp(phone, address) {
            let text = `📚 *DALAB CUSUB - ARAFAT ONLINE SHOP*\n\n`;
            text += `📞 *Customer Tel:* ${phone}\n`;
            text += `📍 *Goobta:* ${address}\n\n`;
            text += `🛒 *Buugaagta:* \n`;
            cart.forEach(i => { text += `- ${i.title} (x${i.qty})\n`; });
            text += `\n💰 *Total Price:* $${globalTotal.toFixed(2)}\n`;
            text += `📌 *Payment Method:* EVC Plus Merchant (*789*${MERCHANT_ID}*${globalTotal.toFixed(2)}#)\n`;
            text += `-----------------------------------\n`;
            text += `Dalabkayga halkan iigu xaqiiji fadlan!`;

            // XALKA FINALKA: Link toos ah oo ku furmaya HTTPS ammaan ah, kana badbaadaya xayiraad kasta
            const secureWhatsAppUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
            window.open(secureWhatsAppUrl, '_blank');
            
            // Nidaamka sifada dalabka zaro ka dhig markuu u gudbo WhatsApp
            cart = []; saveCart(); renderCart();
            document.getElementById('checkout-form').reset();
            localStorage.removeItem('customer_phone'); localStorage.removeItem('customer_address');
        }

        renderStore(); renderCart(); loadFormData();
    </script>
</body>
</html>
