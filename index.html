<!DOCTYPE html>

    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card-cut { clip-path: polygon(0 0, 85% 0, 100% 100%, 0 100%); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-animate { animation: slideUp 0.3s ease-out forwards; }
        
        body { padding-bottom: 75px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
            background-color: #131926; border-top: 1px solid #202c33;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; box-sizing: border-box; z-index: 999;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: #8696a0; font-size: 11px; font-weight: bold;
            cursor: pointer; background: none; border: none; flex: 1;
        }

        .nav-item i { font-size: 20px; margin-bottom: 3px; }
        .nav-item.active { color: #00965e; }
        .nav-item.call-btn { color: #00965e; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); display: flex;
            justify-content: center; align-items: flex-end; opacity: 0;
            pointer-events: none; transition: opacity 0.3s ease; z-index: 1000;
        }

        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .modal-content {
            width: 100%; max-width: 500px; background-color: #131926;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 24px 20px 40px 20px; box-sizing: border-box;
            transform: translateY(100%); transition: transform 0.3s ease; text-align: center;
        }

        .modal-overlay.show .modal-content { transform: translateY(0); }
    </style>
</head>

            if ('speechSynthesis' in window) {

                const utterance = new SpeechSynthesisUtterance(text);
                // Isku day Somali voice, haddii kale isticmaal cod dabiici ah

                window.speechSynthesis.speak(utterance);
            }
        }
